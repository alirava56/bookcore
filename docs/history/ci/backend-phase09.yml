name: BookCore Phase 09 Security Governance (runtime verification pending)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  phase09:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: bookcore_owner
          POSTGRES_PASSWORD: phase09_ci_owner_dev_only
          POSTGRES_DB: bookcore
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U bookcore_owner -d bookcore'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bookcore_app:phase09_ci_runtime_dev_only@127.0.0.1:5432/bookcore
      MIGRATION_DATABASE_URL: postgres://bookcore_owner:phase09_ci_owner_dev_only@127.0.0.1:5432/bookcore
      OUTBOX_DATABASE_URL: postgres://bookcore_worker_login:phase09_ci_worker_dev_only@127.0.0.1:5432/bookcore
      OUTBOX_OPS_DATABASE_URL: postgres://bookcore_ops_login:phase09_ci_ops_dev_only@127.0.0.1:5432/bookcore
      MONITOR_API_KEY: phase09_monitor_test_only_not_a_real_secret_32chars
      MONITOR_ALLOWED_IPS: 127.0.0.1,::1
      AUTH_JWT_ISSUER: https://bookcore.test
      AUTH_JWT_AUDIENCE: bookcore-ci
      AUTH_JWT_ACTIVE_KID: p09-ci
      AUTH_JWT_KEYS_JSON: '{"p09-ci":"PHASE09_TEST_KEY_NOT_FOR_PRODUCTION_32_RANDOMLIKE_BYTES_ONLY"}'
      HTTP_HOST: 127.0.0.1
      CORS_ORIGINS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Require authentic dependencies and lockfile
        run: npm ci --no-audit --no-fund
      - name: Reference checks, migration checksums and Phase09 pure tests
        run: |
          npm run verify:reference
          npm run verify:static
          npm run test:booking:isolated
          npm run test:phase08:isolated
          npm run test:phase09:isolated
          npm run test:availability:isolated
          npm run test:session-domain:isolated
      - name: Typecheck lint and build from source
        run: npm run typecheck && npm run lint && npm run build
      - name: Unit tests (zero test discovery fails)
        run: npm run test:unit
      - name: Create isolated test-only DB roles
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE bookcore_app LOGIN PASSWORD 'phase09_ci_runtime_dev_only'"
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE bookcore_worker_login LOGIN PASSWORD 'phase09_ci_worker_dev_only'"
      - name: Apply migrations twice and validate migration ledger
        run: npm run migrate && npm run migrate
      - name: Create separate operational login (never use HTTP credentials)
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE bookcore_ops_login LOGIN PASSWORD 'phase09_ci_ops_dev_only'"
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT bookcore_ops TO bookcore_ops_login"
      - name: Real PostgreSQL and HTTP integration suite (no mocks)
        run: npm run test:integration
      - name: Reconciliation and implemented-only OpenAPI
        run: npm run openapi:current
      - name: Capture failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bookcore-phase09-failure-evidence
          path: |
            evidence/
            docs/verification/
          if-no-files-found: warn
