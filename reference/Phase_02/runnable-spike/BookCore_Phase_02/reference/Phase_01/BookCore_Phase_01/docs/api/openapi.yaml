          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - OWNER
          - MANAGER
          - RECEPTIONIST
          - TRAINER
        status:
          type: string
          enum:
          - ACTIVE
          description: The /me projection never contains revoked memberships.
      required:
      - tenantId
      - userId
      - role
      - status
      description: Current caller ACTIVE staff memberships only; no REVOKED memberships or credentials.
    PublicSession:
