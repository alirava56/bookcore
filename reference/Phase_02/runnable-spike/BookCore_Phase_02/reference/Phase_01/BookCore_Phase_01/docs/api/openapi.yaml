      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffSession'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
      description: Staff-only list; items are StaffSession and may contain DRAFT/CANCELLED/FINISHED.
