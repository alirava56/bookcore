                durationMin:
                  type: integer
                  minimum: 5
                  maximum: 1440
              required:
              - title
              - durationMin
    get:
      tags:
      - Catalog
      operationId: getOrganizationsorgidservices
      summary: List services
      description: Tenant-scoped staff catalog.
      x-authorized-actors: OWNER|MANAGER|RECEPTIONIST|TRAINER
      x-business-rules: Tenant-scoped staff catalog.
      x-idempotency: not required for this operation
      parameters:
