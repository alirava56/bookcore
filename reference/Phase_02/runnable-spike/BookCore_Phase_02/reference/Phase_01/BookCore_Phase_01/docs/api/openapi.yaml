        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                address:
                  type: string
                  maxLength: 500
              required:
              - name
    get:
      tags:
      - Catalog
      operationId: getOrganizationsorgidbranches
      summary: List tenant branches
      description: Tenant scoped; cursor sort by id.
      x-authorized-actors: OWNER|MANAGER|RECEPTIONIST|TRAINER
      x-business-rules: Tenant scoped; cursor sort by id.
      x-idempotency: not required for this operation
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /organizations/{orgId}/resources:
    post:
      tags:
      - Catalog
      operationId: postOrganizationsorgidresources
      summary: Create exclusive Trainer or Room resource
      description: TRAINER requires trainerUserId of active tenant staff and forbids branchId; ROOM requires branchId
        and forbids trainerUserId; a trainer has one Resource per tenant.
      x-authorized-actors: OWNER|MANAGER
      x-business-rules: TRAINER requires trainerUserId of active tenant staff and forbids branchId; ROOM requires
        branchId and forbids trainerUserId; a trainer has one Resource per tenant.
      x-idempotency: not required for this operation
      parameters:
      - $ref: '#/components/parameters/orgId'
      responses:
        '201':
          description: Created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '413':
          $ref: '#/components/responses/Error413'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                type:
                  enum:
                  - TRAINER
                  - ROOM
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 160
                branchId:
                  type: string
                  format: uuid
                trainerUserId:
                  type: string
                  format: uuid
                bufferBeforeMin:
                  type: integer
                  minimum: 0
                  maximum: 240
                bufferAfterMin:
                  type: integer
                  minimum: 0
                  maximum: 240
              required:
              - type
              - displayName
              allOf: &id001
              - if:
                  properties:
                    type:
                      const: TRAINER
                  required:
                  - type
                then:
                  required:
                  - trainerUserId
                  not:
                    required:
                    - branchId
              - if:
                  properties:
                    type:
                      const: ROOM
                  required:
                  - type
                then:
                  required:
                  - branchId
                  not:
                    required:
                    - trainerUserId
              description: 'Type-specific required fields: TRAINER must include trainerUserId and MUST NOT include
                branchId; ROOM must include branchId and MUST NOT include trainerUserId. Both require type and displayName.
                The referenced member/branch must belong to the same tenant.'
    get:
      tags:
      - Catalog
      operationId: getOrganizationsorgidresources
      summary: List tenant resources
      description: Only authenticated ACTIVE Owner/Manager/Receptionist Membership in this Tenant; Resource response
        includes trainerUserId and internal resource links. Trainer is not allowed to enumerate Resource records;
        assigned Trainer calendar is available only through scoped staff Sessions.
      x-authorized-actors: OWNER|MANAGER|RECEPTIONIST
      x-business-rules: Only authenticated ACTIVE Owner/Manager/Receptionist Membership in this Tenant; Resource
        response includes trainerUserId and internal resource links. Trainer is not allowed to enumerate Resource
        records; assigned Trainer calendar is available only through scoped staff Sessions.
      x-idempotency: not required for this operation
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
