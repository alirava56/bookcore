components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT with sub/sid; server re-checks active auth session on writes.
    monitorAuth:
      type: apiKey
      in: header
      name: X-BookCore-Monitor-Key
      description: Internal monitoring credential provisioned outside repository; also restrict by private network/proxy.
        Never embed any token value in documents or example payloads.
  parameters:
    orgId:
      in: path
      name: orgId
      required: true
      schema:
        type: string
        format: uuid
    sessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
        format: uuid
    bookingId:
      in: path
      name: bookingId
      required: true
      schema:
        type: string
        format: uuid
    userId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
    hourId:
      in: path
      name: hourId
      required: true
      schema:
        type: string
        format: uuid
    exceptionId:
      in: path
      name: exceptionId
      required: true
      schema:
        type: string
        format: uuid
    key:
      in: header
      name: Idempotency-Key
      required: true
      description: UUIDv4 scoped to tenant + actor + operation; 24-hour suggested retention. Repeat exact request
        with same key to recover unknown commit outcome.
      schema:
        type: string
        format: uuid
    cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
        maxLength: 512
    limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    from:
      in: query
      name: from
      required: false
      schema:
        type: string
        format: date-time
      description: 'Inclusive Instant filter input: RFC3339 timestamp with explicit numeric offset or Z; normalize
        to UTC. NOT validated against organization scheduling timezone.'
    to:
      in: query
      name: to
      required: false
      schema:
        type: string
        format: date-time
      description: 'Exclusive Instant filter input: RFC3339 timestamp with explicit numeric offset or Z; normalize
        to UTC. NOT validated against organization scheduling timezone. Max span 31 days unless restricted by endpoint.'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        retryable:
          type: boolean
      required:
      - type
      - title
      - status
      - code
      - traceId
    PageInfo:
      type: object
      additionalProperties: false
      properties:
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
      required:
      - nextCursor
      - hasMore
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
      required:
      - id
      - email
      - status
    MeResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/ActiveMembership'
          description: Active staff memberships only. No customer pseudo-role.
      required:
      - user
      - memberships
      description: The authenticated global user and their ACTIVE tenant staff memberships, including an empty array
        if none. Personal booking customers require no staff membership. Never include secrets or revoked membership
        history.
    Tokens:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 4096
        refreshToken:
          type: string
          minLength: 1
          maxLength: 4096
        tokenType:
          const: Bearer
        expiresInSeconds:
          type: integer
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresInSeconds
    Membership:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - OWNER
          - MANAGER
          - RECEPTIONIST
          - TRAINER
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
      required:
      - tenantId
      - userId
      - role
      - status
    Organization:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        cancellationCutoffMin:
          type: integer
          minimum: 0
          maximum: 10080
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
      required:
      - id
      - name
      - timezone
      - cancellationCutoffMin
      - status
    Branch:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type:
          - string
          - 'null'
        active:
          type: boolean
      required:
      - id
      - tenantId
      - name
      - active
    Resource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        type:
          enum:
          - TRAINER
          - ROOM
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        branchId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        trainerUserId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        active:
          type: boolean
        bufferBeforeMin:
          type: integer
          minimum: 0
          maximum: 240
        bufferAfterMin:
          type: integer
          minimum: 0
          maximum: 240
      required:
      - id
      - tenantId
      - type
      - displayName
      - active
      - bufferBeforeMin
      - bufferAfterMin
      allOf: *id001
      description: Internal tenant staff resource. TRAINER is tenant-local across branches (trainerUserId present,
        branchId absent); ROOM is branch-specific (branchId present, trainerUserId absent). Not a public DTO and
        not returned to Trainer Membership.
    Service:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
        durationMin:
          type: integer
          minimum: 5
          maximum: 1440
        active:
          type: boolean
      required:
      - id
      - tenantId
      - title
      - durationMin
      - active
    BusinessHour:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        isoWeekday:
          type: integer
          minimum: 1
          maximum: 7
        startLocal:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        endLocal:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        endDayOffset:
          type: integer
          enum:
          - 0
          - 1
        branchId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        resourceId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        active:
          type: boolean
      required:
      - id
      - isoWeekday
      - startLocal
      - endLocal
      - endDayOffset
      - active
    ScheduleException:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - CLOSED
          - OPEN_OVERRIDE
        startAt:
          type: string
          format: date-time
          description: Persisted UTC instant; response serialized as canonical RFC3339 with trailing Z. Event time
            is independent of the tenant scheduling timezone.
          pattern: Z$
        endAt:
          type: string
          format: date-time
          description: Persisted UTC instant; response serialized as canonical RFC3339 with trailing Z. Event time
            is independent of the tenant scheduling timezone.
          pattern: Z$
        reason:
          type: string
          minLength: 1
          maxLength: 500
        branchId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        resourceId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        active:
          type: boolean
      required:
      - id
      - kind
      - startAt
      - endAt
      - reason
      - active
    Booking:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
          - ATTENDED
          - NO_SHOW
        createdAt:
          type: string
          format: date-time
          description: Booking event creation instant stored in UTC and returned with trailing Z; NOT an input schedule
            timestamp and never subject to tenant IANA-offset matching.
          pattern: Z$
        cancelledAt:
          anyOf:
          - type: string
            format: date-time
            description: Cancellation event instant in UTC, RFC3339 with trailing Z; no scheduling offset validation.
            pattern: Z$
          - type: 'null'
        alreadyCancelled:
          type: boolean
      required:
      - id
      - tenantId
      - sessionId
      - customerId
      - status
      - createdAt
      description: Customer-safe receipt projection shared by booking responses. `createdByActorId` exists in the
        persisted Booking for audit, but is deliberately not exposed through customer-facing Booking API responses.
    Occupancy:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
          description: Persisted UTC instant; response serialized as canonical RFC3339 with trailing Z. Event time
            is independent of the tenant scheduling timezone.
          pattern: Z$
        to:
          type: string
          format: date-time
          description: Persisted UTC instant; response serialized as canonical RFC3339 with trailing Z. Event time
            is independent of the tenant scheduling timezone.
          pattern: Z$
        sessions:
          type: integer
        confirmed:
          type: integer
        attended:
          type: integer
        noShow:
          type: integer
        cancelledBookings:
          type: integer
      required:
      - tenantId
      - from
      - to
      - sessions
      - confirmed
      - attended
      - noShow
      - cancelledBookings
    UserList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    OrganizationList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    MembershipList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
