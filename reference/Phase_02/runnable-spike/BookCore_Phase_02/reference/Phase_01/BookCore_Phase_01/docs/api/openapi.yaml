      - page
    BranchList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    ResourceList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    ServiceList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    BookingList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    BusinessHourList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHour'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    ScheduleExceptionList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleException'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    StaffSession:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        trainerResourceId:
          type: string
          format: uuid
        roomResourceId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Internal room resource identifier or explicit null if no room is assigned; staff only.
        startAt:
          type: string
          format: date-time
          description: Session occurrence instant, stored in UTC and serialized with trailing Z; timezone is the
            original IANA scheduling timezone snapshot. Input offset matching applies only when creating the schedule,
            never to this UTC output.
          pattern: Z$
        endAt:
          type: string
          format: date-time
          description: Session occurrence instant, stored in UTC and serialized with trailing Z; timezone is the
            original IANA scheduling timezone snapshot. Input offset matching applies only when creating the schedule,
            never to this UTC output.
          pattern: Z$
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone snapshot used when validating original scheduling inputs; this field does not
            alter the UTC instants.
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - CANCELLED
          - FINISHED
        capacityTotal:
          type: integer
          minimum: 1
          maximum: 1000
        seatsCommitted:
          type: integer
          minimum: 0
        seatsAvailable:
          type: integer
          minimum: 0
          description: Non-guaranteed snapshot = capacityTotal - seatsCommitted.
        version:
          type: integer
          minimum: 0
      required:
      - id
      - tenantId
      - branchId
      - serviceId
      - trainerResourceId
      - startAt
      - endAt
      - status
      - capacityTotal
      - seatsCommitted
      - seatsAvailable
      - version
      - timezone
      - roomResourceId
      description: Full staff-only Session projection. Never use in unauthenticated response. All timestamps are
        UTC Z; timezone identifies IANA snapshot for local display.
