          type: string
          minLength: 1
          maxLength: 160
          description: Public Service title approved for publication.
        branchName:
          type: string
          minLength: 1
          maxLength: 160
          description: Public-facing branch name.
        startAt:
          type: string
          format: date-time
          pattern: Z$
          description: Published occurrence start UTC instant (canonical RFC3339 Z).
        endAt:
          type: string
          format: date-time
          pattern: Z$
          description: Published occurrence end UTC instant (canonical RFC3339 Z).
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone snapshot for local rendering, not authentication or offset validation of UTC
            output.
        status:
          type: string
          enum:
          - PUBLISHED
        seatsAvailable:
          type: integer
          minimum: 0
          description: Snapshot only, not a reservation guarantee; calculated server-side. No committed/total counter
            disclosed.
      required:
      - id
      - serviceTitle
      - branchName
      - startAt
      - endAt
      - timezone
      - status
      - seatsAvailable
