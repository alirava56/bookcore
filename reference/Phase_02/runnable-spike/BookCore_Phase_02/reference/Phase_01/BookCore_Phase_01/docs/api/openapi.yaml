  /organizations/{orgId}/business-hours:
    post:
      tags:
      - Scheduling
      operationId: postOrganizationsorgidbusiness_Hours
      summary: Create weekly working-hours rule
      description: Exactly one of branchId/resourceId; local time in tenant IANA zone; no conflicting weekly ranges.
      x-authorized-actors: OWNER|MANAGER
      x-business-rules: Exactly one of branchId/resourceId; local time in tenant IANA zone; no conflicting weekly
        ranges.
      x-idempotency: not required for this operation
      parameters:
      - $ref: '#/components/parameters/orgId'
      responses:
        '201':
          description: Created weekly schedule rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessHour'
        '413':
          $ref: '#/components/responses/Error413'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                branchId:
                  type: string
                  format: uuid
                resourceId:
                  type: string
                  format: uuid
                isoWeekday:
                  type: integer
                  minimum: 1
                  maximum: 7
                startLocal:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                endLocal:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                endDayOffset:
                  type: integer
