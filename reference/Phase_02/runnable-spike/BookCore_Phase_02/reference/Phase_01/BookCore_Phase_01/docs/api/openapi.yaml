openapi: 3.1.0
info:
  title: BookCore MVP API — DESIGN CONTRACT (NOT IMPLEMENTED)
  version: 1.1.1-design
  description: PHASE 01 DESIGN CONTRACT ONLY — no backend or runtime tests. Public published-session GET endpoints
    are separate from staff-only session endpoints. Scheduling writes require RFC3339 offset plus matching organization
    IANA timezone; response instants and event timestamps are canonical UTC (Z). See docs/security/AUTHORIZATION_MATRIX.md,
    DOMAIN_MODEL_FA.md, STATE_MACHINES_FA.md, ARCHITECTURE_FA.md, PRD_FA.md and THREAT_MODEL_FA.md for rules. Internal
    and public response types are never interchangeable.
servers:
- url: https://api.example.invalid/api/v1
  description: Illustrative placeholder; not a real deployment
tags:
- name: Auth
- name: Organizations
- name: Catalog
- name: Scheduling
- name: Booking
- name: Reporting
- name: Health
- name: PublicScheduling
  description: Unauthenticated, published-only, minimum-field read models
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Auth
      operationId: postAuthregister
      summary: Create a global user account
      description: Email+password; registration does not imply a tenant membership.
      x-authorized-actors: PUBLIC
      x-business-rules: Email+password; registration does not imply a tenant membership.
      x-idempotency: not required for this operation
      parameters: []
      responses:
        '201':
          description: Registered user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '413':
          $ref: '#/components/responses/Error413'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
              required:
              - email
              - password
  /auth/login:
    post:
      tags:
      - Auth
      operationId: postAuthlogin
      summary: Authenticate and create refresh session
      description: Generic 401 on invalid credentials; rate limit. Refresh token in JSON for API/mobile; cookie
        strategy deferred.
      x-authorized-actors: PUBLIC
      x-business-rules: Generic 401 on invalid credentials; rate limit. Refresh token in JSON for API/mobile; cookie
        strategy deferred.
      x-idempotency: not required for this operation
      parameters: []
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '413':
          $ref: '#/components/responses/Error413'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
              - email
              - password
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: postAuthrefresh
      summary: Rotate refresh token
      description: Lock auth_session then refresh_token, mark old token consumed and insert new. Reusing consumed
        token revokes token family. Atomic.
      x-authorized-actors: REFRESH_TOKEN_HOLDER
      x-business-rules: Lock auth_session then refresh_token, mark old token consumed and insert new. Reusing consumed
        token revokes token family. Atomic.
      x-idempotency: not required for this operation
      parameters: []
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '413':
          $ref: '#/components/responses/Error413'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refreshToken:
                  type: string
                  minLength: 1
                  maxLength: 4096
              required:
              - refreshToken
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: postAuthlogout
      summary: Revoke own auth session
      description: Token sid must belong to actor; revoke same auth_session. No other user sessions affected.
      x-authorized-actors: AUTH_SELF
      x-business-rules: Token sid must belong to actor; revoke same auth_session. No other user sessions affected.
      x-idempotency: not required for this operation
      parameters: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /me:
    get:
      tags:
      - Auth
      operationId: getMe
      summary: Read authenticated global user and ACTIVE staff memberships
      description: '200 returns exactly MeResponse: user plus an array of ACTIVE organizational staff memberships
        (possibly empty). Customer is not a membership role. Never include refresh tokens, password hashes or revoked
        memberships.'
      x-authorized-actors: AUTH_SELF
      x-business-rules: '200 returns exactly MeResponse: user plus an array of ACTIVE organizational staff memberships
        (possibly empty). Customer is not a membership role. Never include refresh tokens, password hashes or revoked
        memberships.'
      x-idempotency: not required for this operation
      parameters: []
      responses:
        '200':
          description: Caller profile and current active staff memberships (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /organizations:
    post:
      tags:
      - Organizations
      operationId: postOrganizations
      summary: Create organization plus Owner membership
      description: Organization and initial Owner Membership created atomically; timezone must resolve to IANA zone.
        No role in body.
      x-authorized-actors: AUTH_SELF
      x-business-rules: Organization and initial Owner Membership created atomically; timezone must resolve to IANA
        zone. No role in body.
      x-idempotency: not required for this operation
      parameters: []
      responses:
        '201':
          description: Created organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '413':
          $ref: '#/components/responses/Error413'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                timezone:
                  type: string
                  minLength: 1
                  maxLength: 64
                cancellationCutoffMin:
                  type: integer
                  minimum: 0
                  maximum: 10080
              required:
              - name
              - timezone
  /organizations/{orgId}:
    get:
      tags:
      - Organizations
      operationId: getOrganizationsorgid
      summary: Read tenant profile
      description: Requires ACTIVE staff membership; otherwise hidden 404.
      x-authorized-actors: OWNER|MANAGER|RECEPTIONIST|TRAINER
      x-business-rules: Requires ACTIVE staff membership; otherwise hidden 404.
      x-idempotency: not required for this operation
      parameters:
      - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /organizations/{orgId}/members:
    get:
      tags:
      - Organizations
      operationId: getOrganizationsorgidmembers
      summary: List staff members
      description: Active membership in tenant; no customer directory. Cursor sorted by userId ascending.
      x-authorized-actors: OWNER|MANAGER
      x-business-rules: Active membership in tenant; no customer directory. Cursor sorted by userId ascending.
      x-idempotency: not required for this operation
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    post:
      tags:
      - Organizations
      operationId: postOrganizationsorgidmembers
      summary: Add staff membership for existing user
      description: Owner may create an additional Owner (existing User) with audit, Manager only Trainer/Receptionist;
        no external invite flow. Requires active Tenant membership and role validation.
      x-authorized-actors: OWNER|MANAGER
      x-business-rules: Owner may create an additional Owner (existing User) with audit, Manager only Trainer/Receptionist;
        no external invite flow. Requires active Tenant membership and role validation.
      x-idempotency: not required for this operation
      parameters:
      - $ref: '#/components/parameters/orgId'
      responses:
        '201':
          description: Created membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '413':
          $ref: '#/components/responses/Error413'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userId:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum:
                  - OWNER
                  - MANAGER
                  - RECEPTIONIST
                  - TRAINER
              required:
              - userId
              - role
  /organizations/{orgId}/members/{userId}:
    patch:
      tags:
      - Organizations
      operationId: patchOrganizationsorgidmembersuserid
      summary: Change staff role or revoke/reactivate
      description: At least one property. Owner cannot revoke last active Owner. Lock organization for mutation.
        Manager only Trainer/Receptionist, cannot elevate own role.
      x-authorized-actors: OWNER|MANAGER
      x-business-rules: At least one property. Owner cannot revoke last active Owner. Lock organization for mutation.
        Manager only Trainer/Receptionist, cannot elevate own role.
      x-idempotency: not required for this operation
      parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '413':
          $ref: '#/components/responses/Error413'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role:
                  type: string
                  enum:
                  - OWNER
                  - MANAGER
                  - RECEPTIONIST
                  - TRAINER
                status:
                  enum:
                  - ACTIVE
                  - REVOKED
              minProperties: 1
  /organizations/{orgId}/branches:
    post:
      tags:
      - Catalog
      operationId: postOrganizationsorgidbranches
      summary: Create a branch
      description: Branch owned by tenant; no cross-tenant references.
      x-authorized-actors: OWNER|MANAGER
      x-business-rules: Branch owned by tenant; no cross-tenant references.
      x-idempotency: not required for this operation
      parameters:
      - $ref: '#/components/parameters/orgId'
      responses:
        '201':
          description: Created branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '413':
