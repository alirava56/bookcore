services:
  postgres:
    image: postgres:17.11-bookworm
    container_name: bookcore-phase02-postgres
    environment:
      POSTGRES_DB: bookcore_spike
      POSTGRES_USER: bookcore
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:-bookcore_local_only}
      TZ: UTC
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookcore -d bookcore_spike"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
